<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <!-- Mock 主应用 -->
      <h1>No Prefix H1</h1>
      <p>
        No Prefix P
        <span>No Prefix Span</span>
      </p>

      <!-- Mock 微应用 -->
      <div
        id="__qiankun_microapp_wrapper_for_vue__"
        data-name="vue"
        data-version="2.10.16"
        data-sandbox-cfg="false"
      >
        <qiankun-head>
          <!-- 需要将 body 处理成 div[data-name="vue"] { padding: 8px; } -->
          <style>
            body {
              padding: 8px;
            }
          </style>

          <!-- 需要将 h1 处理成 div[data-name="vue"] h1 -->
          <style>
            h1 {
              background-color: blue;
            }
          </style>

          <!-- 需要将 p 处理成 div[data-name="vue"] p -->
          <style>
            p {
              font-size: 40px;
            }
          </style>

          <!-- 需要将 body p 处理成 div[data-name="vue"] p -->
          <style>
            body p {
              color: green;
            }
          </style>

          <!-- 需要将 p span 处理成 div[data-name="vue"] p span -->
          <style>
            p span {
              color: red;
            }
          </style>

          <!-- 需要将 p, span 处理成 div[data-name="vue"] p, div[data-name="vue"] span -->
          <style>
            p,
            span {
              outline: red solid 1px;
            }
          </style>

          <!-- 需要去除 html 选择器，并将 body 处理成 div[data-name="vue"] -->
          <style>
            html > body {
              border: 10px solid red;
            }
          </style>

          <!-- 这里会被处理成什么呢？-->
          <style>
            html + body {
              background-color: blue;
            }
          </style>

          <!-- 没有 CSS 样式的 style 标签 -->
          <style id="dynamic-style"></style>

          <!-- 已有 CSS 样式的 style 标签-->
          <style id="existed-style">
            p,
            span {
              background-color: yellow;
            }
          </style>
        </qiankun-head>
        <!-- 这里的 body 会像 head 一样消失，同一个 HTML 中不会出现多个 body 或者 head -->
        <body>
          <h1>Prefix H1</h1>
          <p>
            Prefix P
            <span>Prefix Span</span>
          </p>
        </body>
      </div>
    </div>

    <script>
      const ModifiedTag = "Symbol(style-modified-qiankun)";

      // 获取微应用的 qiankun 容器元素
      const appElement = document.getElementById(
        "__qiankun_microapp_wrapper_for_vue__"
      );
      // 获取微应用的所有 style 标签
      const styleNodes = appElement.querySelectorAll("style");
      console.log("styleNodes", styleNodes);

      const tag = appElement.tagName.toLowerCase();
      const QiankunCSSRewriteAttr = "data-name";
      const appName = appElement.getAttribute(QiankunCSSRewriteAttr);
      // 生成 qiankun 容器选择器的前缀, 例如：div[data-name="vue"]
      const prefix = `${tag}[${QiankunCSSRewriteAttr}="${appName}"]`;

      // 创建一个 style 标签，用于处理样式选择器，添加 qiankun 容器选择器的前缀
      const prefixStyleNode = document.createElement("style");
      // 将 style 标签插入到 body 中
      document.body.appendChild(prefixStyleNode);
      const styleSheet = prefixStyleNode.sheet;
      // 禁用 style 标签的 css 样式表
      // https://developer.mozilla.org/zh-CN/docs/Web/API/StyleSheet/disabled
      styleSheet.disabled = true;

      // 这里如果设置 styleNode.sheet.disabled = true; 会导致页面中的样式直接消失
      // styleNode.sheet.disabled = true;

      // 遍历 style 标签
      styleNodes.forEach((styleNode) => {
        // 批量处理 style 标签，给所有的样式选择器添加 qiankun 容器选择器的前缀
        process(styleNode, prefix);
      });

      // 注意：这里是 style 标签存在并且内部没有内容的情况
      // 动态给标签添加样式
      const dynamicStyleNode = document.getElementById("dynamic-style");
      dynamicStyleNode.textContent = `
        h1 {
          font-size: 80px;
        }
      `;

      // 注意：这里是 style 标签存在并且内部有内容的情况
      const existedStyleNode = document.getElementById("existed-style");
      existedStyleNode.textContent = `
        p,
        span {
          background-color: blue;
        }
      `;

      function process(styleNode, prefix) {
        if (styleNode.textContent !== "") {
          // 将所有 style 标签的文本内容添加到新的 style 标签中
          const textNode = document.createTextNode(styleNode.textContent || "");
          prefixStyleNode.appendChild(textNode);

          // 添加文本内容后，需要重新获取 style 的样式表
          const styleSheet = prefixStyleNode.sheet;

          // 获取样式表的 CSS 规则列表，返回的是一个 CSSRuleList 类数组对象，包含了样式表中的所有规则
          // cssRules: https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleSheet/cssRules
          // rules: https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleSheet/rules
          // CSSRuleList: https://developer.mozilla.org/zh-CN/docs/Web/API/CSSRuleList
          const rules = styleSheet.cssRules || styleSheet.rules;

          let css = "";

          // 遍历样式表的 CSS 规则列表
          Array.from(rules).forEach((rule) => {
            css += ruleStyle(rule, prefix);
          });

          styleNode.textContent = css;
          // 标记当前 style 标签已经处理过了
          styleNode[ModifiedTag] = true;
          // 处理完后清除 style 标签中的 textNode
          prefixStyleNode.removeChild(textNode);

          // 如果 style 标签没有内容，那么需要监听 style 标签的变化
        } else {
          // MutationObserver: https://developer.mozilla.org/zh-CN/docs/Web/API/MutationObserver
          const observer = new MutationObserver((mutations) => {
            // 如果 style 标签已经被 ScopedCSS 处理过，则直接返回
            // 防止重复处理
            if (ModifiedTag in styleNode) {
              return;
            }

            mutations.forEach((mutation) => {
              if (mutation.type === "childList") {
                // 如果 style 标签的内容发生变化，那么需要重新处理样式
                // 将 CSSRuleList 转换成 Array
                const sheet = styleNode.sheet;
                // 对样式进行 scope 处理
                const rules = sheet.cssRules || sheet.rules;
                let css = "";
                Array.from(rules).forEach((rule) => {
                  css += ruleStyle(rule, prefix);
                });
                // 重新设置 style 标签的内容（注意这里的变更会再次触发 MutationObserver）
                styleNode.textContent = css;
                // 标记当前 style 标签已经处理过了
                styleNode[ModifiedTag] = true;
              }
            });
          });

          // 监听 style 标签的子节点变化
          observer.observe(styleNode, {
            childList: true,
          });
        }
      }

      function ruleStyle(rule, prefix) {
        // 例如上述样式 h1 { background-color: blue; }
        // 获取选择器的文本内容，例如 h1
        const selector = rule.selectorText.trim();
        // 获取样式的文本内容，例如 h1 { background-color: blue; }
        let cssText = rule.cssText;
        const rootSelectorRE = /((?:[^\w\-.#]|^)(body|html|:root))/gm;
        const rootCombinationRE = /(html[^\w{[]+)/gm;
        if (
          selector === "html" ||
          selector === "body" ||
          selector === ":root"
        ) {
          // body { padding: 8px; } 被替换成 div[data-name="vue"] { padding: 8px; }
          // body 样式是根样式，而在微应用中 body 对应的是 qiankun 的容器元素 div[data-name="vue"]
          // 因此需要将 body 样式替换成 div[data-name="vue"]
          return cssText.replace(rootSelectorRE, prefix);
        }

        if (rootCombinationRE.test(rule.selectorText)) {
          const siblingSelectorRE = /(html[^\w{]+)(\+|~)/gm;

          if (!siblingSelectorRE.test(rule.selectorText)) {
            cssText = cssText.replace(rootCombinationRE, "");
          }
        }

        // INFO: 这里可以加入一些复杂的选择器进行调试，例如 body p { color: red; }

        // 例如："h1 { background-color: blue; }"
        // selectors: "h1 {"

        // 例如： "body p { color: green; }
        // selectors: "body p {"

        // 例如： "div p span { color: red; }"
        // selectors: "p span {"

        // 例如：
        // p,
        // span {
        //   outline: red solid 1px;
        // }
        // selectors: "p, span {"
        cssText = cssText.replace(/^[\s\S]+{/, (selectors) => {
          // 例如："h1 { background-color: blue; }"
          // item: "h1 {"
          // p: ""
          // s: "h1 {"

          // 例如： "body p { color: green; }
          // item: "body p {"
          // p: ""
          // s: "body p {"

          // 例如： "div p span { color: red; }"
          // item: "div p span {"
          // p: ""
          // s: "div p span {"

          // 例如：
          // p,
          // span {
          //   outline: red solid 1px;
          // }

          return selectors.replace(/(^|,\n?)([^,]+)/g, (item, p, s) => {
            // INFO: 这里的作用就是将 body html :root 替换成 div[data-name="vue"]
            if (rootSelectorRE.test(item)) {
              return item.replace(rootSelectorRE, (m) => {
                // 例如： "body p { color: green; }
                // m: "body"
                const whitePrevChars = [",", "("];
                if (m && whitePrevChars.includes(m[0])) {
                  return `${m[0]}${prefix}`;
                }
                // 例如： "body p { color: green; }
                // 返回： div[data-name="vue"]
                // 最后变成了 div[data-name="vue"] p { color: green; }
                return prefix;
              });
            }
            // 例如："h1 { background-color: blue; }"
            // 返回： div[data-name="vue"] h1 {

            // 例如： "p span { color: red; }"
            // 返回: div[data-name="vue"] p span {

            // 例如：
            // p,
            // span {
            //   outline: red solid 1px;
            // }

            // 第一轮：p: "", s: "p", 返回： div[data-name="vue"] p
            // 第二轮：p: ",", s: " span {", 返回： , div[data-name="vue"] span {
            return `${p}${prefix} ${s.replace(/^ */, "")}`;
          });
        });
        return cssText;
      }

      // 移除 style 标签
      // document.body.removeChild(prefixStyleNode);
    </script>

    <!-- 假设以下代码在微应用中执行，此时应该如何将 CSS 样式放入微应用的 <qiankun-head>，那么应该如何处理呢？  -->
    <!-- 如果不做任何处理，此时 <style> 标签存在于主应用的 <head> 下 -->
    <script>
      const style = document.createElement("style");
      style.textContent = `
        span {
          font-size: 40px;
        }
      `;
      document.head.appendChild(style);
    </script>
  </body>
</html>
